name: The Sample CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code...
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17...
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      # Uncomment if needed to generate local.properties...
      #      - name: Create local.properties...
      #        run: |
      #          echo "apiKey=${{ secrets.API_KEY }}" > local.properties

      - name: Grant Execute Permission to Gradle Wrapper...
        run: chmod +x gradlew

      - name: Format the code...
        run: |
          chmod +x ./codeInspector.sh
          ./codeInspector.sh

      - name: Scan for Secrets with Gitleaks...
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_EXIT_CODE: "1"

      - name: Run Snyk to check for vulnerabilities...
        uses: snyk/actions/gradle@master
        continue-on-error: true # To make sure that SARIF upload gets called...
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          sarif: true

      - name: Generate The SBOM with Syft...
        uses: anchore/sbom-action@v0
        with:
            path: .
            format: spdx-json
            artifact-name: sample.spdx # Please change this to match your project's name...
            output-file: sbom.json

      - name: Run Android Lint...
        run: ./gradlew lintDebug

      - name: Build The Debug APK...
        run: ./gradlew assembleDebug

      - name: Upload The Debug APK...
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/build/outputs/apk/debug/android-debug.apk